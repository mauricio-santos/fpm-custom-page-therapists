_schema-version: "3.2"
ID: fpm-custom-page-therapists
version: 0.0.1
modules:
- name: fpm-custom-page-therapists-approuter
  type: approuter.nodejs
  path: fpm-custom-page-therapists-approuter
  requires:
  - name: fpm-custom-page-therapists_html_repo_runtime
  - name: uaa_fpm-custom-page-therapists
  - name: fpm-custom-page-therapists-destination-service
    group: destinations
    properties:
      forwardAuthToken: false
      name: ui5
      url: https://ui5.sap.com

  properties:
      # Allow the application to be embedded in SAP Build Work Zone.
      # Disable the default X-Frame-Options: SAMEORIGIN header and restrict
      # iframe embedding via CSP to the application itself and the Work Zone domain.
      # SAP Build Work Zone (Launchpad) URL allowed to embed this application in an iframe.
      # Work Zone URL: https://d94ba6c0trial.launchpad.cfapps.us10.hana.ondemand.com
      # Console error: Refused to display 'https://d94ba6c0trial-dev-fpm-custom-page-therapists-approuter.cfapps.us10-003.hana.ondemand.com/' in a frame because it set 'X-Frame-Options' to 'sameorigin'.
      SEND_XFRAMEOPTIONS: false
      httpHeaders: >
        [
          {
            "Content-Security-Policy": "frame-ancestors 'self' https://d94ba6c0trial.launchpad.cfapps.us10.hana.ondemand.com"
          }
        ]

  parameters:
    disk-quota: 256M
    memory: 256M
- name: fpm-custom-page-therapists_ui_deployer
  type: com.sap.application.content
  path: .
  requires:
  - name: fpm-custom-page-therapists_html_repo_host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - santostherapists.zip
      name: santostherapists
      target-path: resources/
- name: santostherapists
  type: html5
  path: therapists
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: fpm-custom-page-therapists_html_repo_runtime
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-runtime
- name: uaa_fpm-custom-page-therapists
  type: org.cloudfoundry.managed-service
  parameters:
    path: ./xs-security.json
    service: xsuaa
    service-name: fpm-custom-page-therapists-xsuaa-service
    service-plan: application
- name: fpm-custom-page-therapists_html_repo_host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-plan: app-host
- name: fpm-custom-page-therapists-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: fpm-custom-page-therapists-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
